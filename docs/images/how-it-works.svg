<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="4" y="4" width="1192" height="282" rx="22" fill="#e9e9e5" stroke="#222" stroke-width="5"/>
  <defs>
    <g id="arrow"><path d="M0,0 L18,0" stroke="#222" stroke-width="5" stroke-linecap="round"/><polygon points="14,-9 28,0 14,9" fill="#222"/></g>
  </defs>

  <g font-weight="800" fill="#1d1d1d" text-anchor="middle">
    <!-- 1 search -->
    <rect x="58" y="78" width="190" height="170" rx="12" fill="#222"/>
    <rect x="50" y="70" width="190" height="170" rx="12" fill="#7cc4ff" stroke="#222" stroke-width="4"/>
    <circle cx="145" cy="70" r="20" fill="#f7f7f3" stroke="#222" stroke-width="4"/><text x="145" y="78" font-size="20">1</text>
    <text x="145" y="138" font-size="24">Search</text>
    <text x="145" y="176" font-size="15" font-weight="600">arXiv, Semantic</text>
    <text x="145" y="198" font-size="15" font-weight="600">Scholar, OpenAlex</text>
    <use href="#arrow" x="250" y="155"/>

    <!-- 2 merge -->
    <rect x="296" y="78" width="190" height="170" rx="12" fill="#222"/>
    <rect x="288" y="70" width="190" height="170" rx="12" fill="#f7f7f3" stroke="#222" stroke-width="4"/>
    <circle cx="383" cy="70" r="20" fill="#f7f7f3" stroke="#222" stroke-width="4"/><text x="383" y="78" font-size="20">2</text>
    <text x="383" y="138" font-size="24">Merge</text>
    <text x="383" y="176" font-size="15" font-weight="600">Duplicates joined</text>
    <text x="383" y="198" font-size="15" font-weight="600">by DOI &amp; arXiv ID</text>
    <use href="#arrow" x="488" y="155"/>

    <!-- 3 filter -->
    <rect x="534" y="78" width="190" height="170" rx="12" fill="#222"/>
    <rect x="526" y="70" width="190" height="170" rx="12" fill="#ff8b7b" stroke="#222" stroke-width="4"/>
    <circle cx="621" cy="70" r="20" fill="#f7f7f3" stroke="#222" stroke-width="4"/><text x="621" y="78" font-size="20">3</text>
    <text x="621" y="138" font-size="24">Filter</text>
    <text x="621" y="176" font-size="15" font-weight="600">Off-topic and</text>
    <text x="621" y="198" font-size="15" font-weight="600">seen papers dropped</text>
    <use href="#arrow" x="726" y="155"/>

    <!-- 4 read -->
    <rect x="772" y="78" width="190" height="170" rx="12" fill="#222"/>
    <rect x="764" y="70" width="190" height="170" rx="12" fill="#fff27a" stroke="#222" stroke-width="4"/>
    <circle cx="859" cy="70" r="20" fill="#f7f7f3" stroke="#222" stroke-width="4"/><text x="859" y="78" font-size="20">4</text>
    <text x="859" y="138" font-size="24">Read</text>
    <text x="859" y="176" font-size="15" font-weight="600">AI writes a card</text>
    <text x="859" y="198" font-size="15" font-weight="600">and scores it 0–10</text>
    <use href="#arrow" x="964" y="155"/>

    <!-- 5 notify -->
    <rect x="1010" y="78" width="150" height="170" rx="12" fill="#222"/>
    <rect x="1002" y="70" width="150" height="170" rx="12" fill="#8fe3a4" stroke="#222" stroke-width="4"/>
    <circle cx="1077" cy="70" r="20" fill="#f7f7f3" stroke="#222" stroke-width="4"/><text x="1077" y="78" font-size="20">5</text>
    <text x="1077" y="138" font-size="24">Notify</text>
    <text x="1077" y="176" font-size="15" font-weight="600">Desktop, phone</text>
    <text x="1077" y="198" font-size="15" font-weight="600">or email digest</text>
  </g>
</svg>
