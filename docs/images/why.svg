<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" font-family="Poppins, 'Segoe UI', Helvetica, Arial, sans-serif">
  <rect x="4" y="4" width="1192" height="492" rx="22" fill="#e9e9e5" stroke="#222" stroke-width="5"/>

  <!-- before -->
  <rect x="50" y="48" width="500" height="410" rx="14" fill="#222"/>
  <rect x="40" y="38" width="500" height="410" rx="14" fill="#dedcd5" stroke="#222" stroke-width="4"/>
  <text x="70" y="90" font-size="26" font-weight="800" fill="#55554f">Without Frontline</text>
  <g font-size="19" font-weight="600" fill="#1d1d1d">
    <g transform="translate(70,130)"><circle r="14" cx="14" cy="0" fill="#ff6b5b" stroke="#222" stroke-width="3"/><path d="M8,-6 L20,6 M20,-6 L8,6" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><text x="42" y="7">A dozen arXiv tabs every morning</text></g>
    <g transform="translate(70,190)"><circle r="14" cx="14" cy="0" fill="#ff6b5b" stroke="#222" stroke-width="3"/><path d="M8,-6 L20,6 M20,-6 L8,6" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><text x="42" y="7">Alerts full of off-topic hits</text></g>
    <g transform="translate(70,250)"><circle r="14" cx="14" cy="0" fill="#ff6b5b" stroke="#222" stroke-width="3"/><path d="M8,-6 L20,6 M20,-6 L8,6" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><text x="42" y="7">Reading 20 abstracts to find 1 gem</text></g>
    <g transform="translate(70,310)"><circle r="14" cx="14" cy="0" fill="#ff6b5b" stroke="#222" stroke-width="3"/><path d="M8,-6 L20,6 M20,-6 L8,6" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><text x="42" y="7">PDFs lost in Downloads</text></g>
    <g transform="translate(70,370)"><circle r="14" cx="14" cy="0" fill="#ff6b5b" stroke="#222" stroke-width="3"/><path d="M8,-6 L20,6 M20,-6 L8,6" stroke="#222" stroke-width="3.5" stroke-linecap="round"/><text x="42" y="7">Deadlines on a sticky note</text></g>
  </g>

  <!-- arrow -->
  <path d="M566,243 L618,243" stroke="#222" stroke-width="8" stroke-linecap="round"/>
  <polygon points="612,225 640,243 612,261" fill="#222"/>

  <!-- after -->
  <rect x="670" y="48" width="500" height="410" rx="14" fill="#222"/>
  <rect x="660" y="38" width="500" height="410" rx="14" fill="#fff27a" stroke="#222" stroke-width="4"/>
  <text x="690" y="90" font-size="26" font-weight="800" fill="#1d1d1d">With Frontline</text>
  <g font-size="19" font-weight="600" fill="#1d1d1d">
    <g transform="translate(690,130)"><circle r="14" cx="14" cy="0" fill="#8fe3a4" stroke="#222" stroke-width="3"/><path d="M7,0 L12,6 L22,-6" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="7">One click searches 3 databases</text></g>
    <g transform="translate(690,190)"><circle r="14" cx="14" cy="0" fill="#8fe3a4" stroke="#222" stroke-width="3"/><path d="M7,0 L12,6 L22,-6" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="7">Only papers you haven't seen</text></g>
    <g transform="translate(690,250)"><circle r="14" cx="14" cy="0" fill="#8fe3a4" stroke="#222" stroke-width="3"/><path d="M7,0 L12,6 L22,-6" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="7">AI summary + 0–10 score each</text></g>
    <g transform="translate(690,310)"><circle r="14" cx="14" cy="0" fill="#8fe3a4" stroke="#222" stroke-width="3"/><path d="M7,0 L12,6 L22,-6" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="7">A library that syncs via Drive</text></g>
    <g transform="translate(690,370)"><circle r="14" cx="14" cy="0" fill="#8fe3a4" stroke="#222" stroke-width="3"/><path d="M7,0 L12,6 L22,-6" fill="none" stroke="#222" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><text x="42" y="7">Live deadline countdowns</text></g>
